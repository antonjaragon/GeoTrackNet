name: PY3GPU
channels:
  - conda-forge
  - nodefaults
dependencies:
  # Apple's tensorflow-metal officially supports Python 3.9/3.10
  - python=3.10
  # --- scientific stack ---
  - numpy=1.26        # TF 2.15 needs numpy < 2
  - scipy
  - pandas
  - scikit-learn
  - matplotlib
  - h5py
  - joblib
  - cloudpickle
  - pyproj
  - psutil
  - pyyaml
  - requests
  - tqdm
  # --- notebooks / IDE / tooling ---
  - jupyter
  - ipykernel
  - ipywidgets
  - spyder
  - pylint
  - flake8
  - autopep8
  - yapf
  - sphinx
  - numpydoc
  - pandoc
  - pip
  - pip:
    # For TF >= 2.13 the base package is plain `tensorflow` (tensorflow-macos is only for <= 2.12).
    # protobuf/keras/tensorboard are pulled in by TF itself; Keras ships as tf.keras.
    - tensorflow==2.15.0
    - tensorflow-metal==1.1.0          # Metal GPU plugin matching TF 2.15
    - tensorflow-probability==0.23.0   # matches TF 2.15
    - dm-sonnet>=2.0.0,<3              # Sonnet 2 = TF2 rewrite (not compatible with Sonnet 1.x code)
    - datetime==4.3
    - zope-interface==4.7.1

